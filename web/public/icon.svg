<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Свод">
  <title>Свод</title>
  <!-- Тайл в цвете 藍墨茶 aisumicha — тот же, что холст приложения -->
  <rect width="64" height="64" rx="14" fill="#12171A"/>

  <!-- Свод: перекрытие на двух опорах. Пролёт шире высоты — так это
       читается сводом, а не дверным проёмом. Стенки толстые, чтобы
       форма держалась на 16 пикселях. -->
  <g fill="#4FB3BF">
    <path d="M10 46 V33 A22 22 0 0 1 54 33 V46 H44 V33 A12 12 0 0 0 20 33 V46 Z"/>
    <rect x="10" y="49" width="44" height="6" rx="1.5"/>
  </g>
</svg>
