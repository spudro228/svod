[defaults]
inventory = inventory.ini
host_key_checking = True
# Отдельный callback yaml удалён из community.general — то же самое
# делает штатный вывод с этой настройкой.
result_format = yaml
display_skipped_hosts = False
interpreter_python = auto_silent
retry_files_enabled = False

[ssh_connection]
pipelining = True
