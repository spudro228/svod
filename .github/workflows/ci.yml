name: Проверки

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Сервер и демон
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      # Каталог сборки фронта нужен go:embed ещё до самой сборки.
      - name: Заглушка для встроенного клиента
        run: mkdir -p internal/webui/dist && touch internal/webui/dist/.gitkeep

      - run: go vet ./...
      - run: go test ./... -count=1

  e2e:
    name: Браузер
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web

      # Тесты сами поднимают настоящий svodd с вшитым клиентом.
      - run: npx playwright test
        working-directory: web

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: отчёт-playwright
          path: web/playwright-report/
          retention-days: 7
